<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teftiş Kurulu Başkanlığı İnceleme ve Soruşturma Modülü</title>
    <meta name="description" content="Soruşturma belge şablonları oluşturma ve PDF üretim modülü">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="logo" onclick="navigateTo('')" style="cursor: pointer;">
                    <img src="logo.png" alt="MEB Logo" class="logo-image"
                        style="height: 48px; width: auto; margin-right: 12px;">
                    <div class="logo-text">
                        <h1>Teftiş Kurulu Başkanlığı</h1>
                        <span class="subtitle">İnceleme ve Soruşturma Modülü</span>
                    </div>
                </div>
                <nav class="header-nav">
                    <a href="#" onclick="navigateTo(''); return false;" class="nav-link" id="navHome">
                        <span>🏠</span> Ana Sayfa
                    </a>
                    <a href="#/documents" onclick="navigateTo('documents'); return false;" class="nav-link"
                        id="navDocuments">
                        <span>📋</span> Belgelerim
                    </a>
                    <div class="user-menu" id="userMenu" style="display: none;">
                        <button class="user-menu-btn" onclick="toggleUserMenu()" id="userMenuBtn">
                            <div class="user-avatar">👤</div>
                            <span class="user-name-text" id="userNameDisplay">Kullanıcı</span>
                            <span class="user-menu-arrow">▼</span>
                        </button>
                        <div class="user-dropdown" id="userDropdown">
                            <div class="dropdown-header">
                                <span class="dropdown-user-role">Müfettiş</span>
                                <span class="dropdown-user-email" id="userEmailDisplay">user@meb.gov.tr</span>
                            </div>
                            <div class="dropdown-divider"></div>
                            <a href="#" class="dropdown-item disabled" title="Yakında">
                                <span>⚙️</span> Ayarlar
                            </a>
                            <div class="dropdown-divider"></div>
                            <a href="#" class="dropdown-item text-danger" onclick="AuthService.logout(); return false;">
                                <span>🚪</span> Çıkış Yap
                            </a>
                        </div>
                    </div>
                </nav>
            </div>
        </header>

        <!-- Breadcrumb -->
        <div class="breadcrumb-container" id="breadcrumbContainer">
            <nav class="breadcrumb" id="breadcrumb">
                <!-- Breadcrumb dinamik olarak doldurulacak -->
            </nav>
        </div>

        <!-- Main Content - Dinamik olarak değişecek -->
        <main class="main-content" id="mainContent">
            <!-- İçerik JavaScript tarafından yüklenir -->
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p>Teftiş Kurulu Başkanlığı İnceleme ve Soruşturma Modülü - v1.2</p>
        </footer>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loading-spinner"></div>
        <p>PDF oluşturuluyor...</p>
    </div>

    <script src="themes.js?v=1.3"></script>
    <script src="auth-service.js?v=1.3"></script>
    <script src="data-service.js?v=1.3"></script>
    <script src="templates_data.js?v=1.3"></script>
    <script src="app.js?v=1.4"></script>
    <script src="template121_patch.js?v=1.3"></script>
    <script src="router.js?v=1.3"></script>
</body>

</html>
